# Insert into an EXISTING HTTPS server after choosing the hostname and TLS route.
# This file does not listen on 443 and must not replace your Xray/nginx setup.
location ~ ^/(mcp|oauth/|\.well-known/oauth-) {
    proxy_pass http://127.0.0.1:18765;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    client_max_body_size 64k;
    client_body_timeout 15s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_buffering off;
    access_log off;
    # Also exclude OAuth query strings and headers from surrounding/error tracing.
}
